backend:
  # Autenticação nativa do GitHub via OAuth (Livre do Netlify)
  name: github
  repo: pandarosan/ContabilidadeCamiloSite
  branch: main # Defina como master se for a branch principal
  base_url: https://cms-auth.thais-cristina-camilo.workers.dev
  auth_endpoint: /auth
  
media_folder: "public" # Pasta estática do Vite
public_folder: "/"

locale: 'pt'

collections:
  - name: "artigos"
    label: "Notícias & Artigos"
    folder: "artigos"
    create: true
    slug: "{{slug}}"
    summary: "{{date | date('DD/MM/YYYY HH:mm')}} - {{title}}"
    fields:
      - { label: "Título do Artigo", name: "title", widget: "string", required: true }
      - { label: "URL Amigável (Slug)", name: "slug", widget: "string", required: false, hint: "Deixe VAZIO para geração automaticamente a partir do Título. Preencha apenas se quiser personalizar (ex: meu-artigo-123)." }
      - { label: "Categoria", name: "category", widget: "select", options: ["Simples Nacional", "Trabalhista & Previdenciário", "Gestão Empresarial", "Imposto de Renda", "Tributário & Impostos", "Reforma Tributária", "Abertura de Empresas", "Planejamento Tributário", "BPO Financeiro", "Lucro Presumido e Real", "Tecnologia & Inovação", "Avisos do Escritório"], default: "Tributário & Impostos" }
      - { label: "Data de Publicação", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false, required: true, hint: "⚠️ NÃO DIGITE. Para alterar a data, clique neste campo e use o Calendário ou o botão 'Agora'." }
      - { label: "Imagem de Capa (Recomendado: 1200x630px JPG)", name: "image", widget: "image", required: true }
      - { label: "Texto Alternativo da Capa (Alt Text para SEO)", name: "image_alt", widget: "string", required: false, hint: "Descreva a imagem (ex: Contadora trabalhando com gráficos)." }
      - { label: "Título da Capa (Title)", name: "image_title", widget: "string", required: false, hint: "Aparece quando o usuário passa o mouse na imagem." }
      - { label: "Resumo (Chamada curta para o card)", name: "summary", widget: "text", required: true }
      - { label: "Corpo do Artigo", name: "body", widget: "markdown", required: true, hint: "Use o editor visual para formatar texto, adicionar subtítulos e listas!" }

  - name: "sistema"
    label: "⚙️ Configurações do Sistema"
    files:
      - label: "📊 Base de Dados das Calculadoras"
        name: "calculadora_simples"
        file: "data/configuracoes.json"
        description: "Faça o upload dos seus arquivos .xlsx com as tabelas tributárias atualizadas."
        fields:
          - { label: "Planilha do Simples Nacional (.xlsx)", name: "planilha_excel", widget: "file", hint: "Envie o arquivo do Simples Nacional atualizado aqui." }
          - { label: "Planilha do IRPF (.xlsx)", name: "planilha_irpf", widget: "file", hint: "Envie o arquivo do IRPF atualizado aqui.", required: false }
          - { label: "Planilha do INSS (.xlsx)", name: "planilha_inss", widget: "file", hint: "Envie o arquivo do INSS atualizado aqui.", required: false }
