<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Cliente | Gestão de Conteúdo - Contabilidade Camilo</title>
  <!-- Widget oficial de autenticação Netlify Identity -->

</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <!-- Script principal do Decap CMS (antigo Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Script de redirecionamento para o login pós-autenticação -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // PATCH DE SEGURANÇA: Contorno para o Bug do Chrome (WindowProxy) com o Decap CMS
    // Em navegadores modernos, a janela do popup perde a referência de origem ao redirecionar para o GitHub.
    // Isso faz o CMS ignorar a chave de acesso. Este script intercepta a chave e força o login!
    window.addEventListener("message", (e) => {
      if (typeof e.data === "string" && e.data.match(/^authorization:github:success:/)) {
        console.log("Token capturado com sucesso pelo patch de segurança!");
        const data = JSON.parse(e.data.replace(/^authorization:github:success:/, ""));
        if (data.token) {
          const userData = {
            backendName: "github",
            token: data.token
          };
          // Salva o token exatamente onde o CMS espera encontrar
          localStorage.setItem("netlify-cms-user", JSON.stringify(userData));
          // Recarrega a página para o CMS iniciar já logado
          window.location.reload();
        }
      }
    });
  </script>
</body>
</html>
