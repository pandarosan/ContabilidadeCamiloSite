<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login Efetuado</title>
</head>
<body>
  <p>Autenticando... Redirecionando para o CMS.</p>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      document.body.innerHTML = "<p>Verificando credenciais no GitHub...</p>";
      
      // Busca o perfil do usuário diretamente do GitHub usando o token
      fetch('https://api.github.com/user', {
        headers: { 
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github.v3+json'
        }
      })
      .then(res => res.json())
      .then(user => {
        // Monta o objeto EXATAMENTE como o Decap CMS salva nativamente
        const userData = {
          backendName: "github",
          token: token,
          login: user.login,
          name: user.name || user.login,
          email: user.email,
          avatar_url: user.avatar_url
        };
        
        // Salva no LocalStorage da aba principal
        localStorage.setItem("netlify-cms-user", JSON.stringify(userData));
        
        // Exibe mensagem de sucesso visual na janela
        document.body.innerHTML = "<h2 style='color: green;'>✅ Autenticação concluída!</h2><p>O painel principal já deve estar carregando no fundo. Se esta janela não fechar sozinha, pode fechá-la com segurança.</p>";
        
        // Recarrega a aba do painel e fecha a janelinha
        if (window.opener && !window.opener.closed) {
          window.opener.location.reload();
        }
        setTimeout(() => window.close(), 1500);
      })
      .catch(err => {
        document.body.innerHTML = "<p>Erro na conexão com o GitHub: " + err.message + "</p>";
      });
    } else {
      document.body.innerHTML = "<p>Erro: Token não encontrado na URL.</p>";
    }
  </script>
</body>
</html>
