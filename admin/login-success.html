<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login Efetuado</title>
</head>
<body>
  <p>Autenticando... Redirecionando para o CMS.</p>
  <script>
    // Recupera o token da URL (adicionado pelo Cloudflare Worker)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      // Como estamos no MESMO domínio do CMS, o Chrome não bloqueia a comunicação!
      // Podemos enviar a mensagem exatamente no formato que o Decap CMS nativo entende:
      const msg = 'authorization:github:success:{"token":"' + token + '","provider":"github"}';
      
      if (window.opener && !window.opener.closed) {
        // Envia a chave nativa para o painel principal
        window.opener.postMessage(msg, window.location.origin);
      }
      
      // Espera 1 segundo para o CMS pegar a mensagem e fecha
      setTimeout(() => {
        window.close();
      }, 1000);
    } else {
      document.body.innerHTML = "<p>Erro: Token não encontrado na URL.</p>";
    }
  </script>
</body>
</html>
